<!DOCTYPE html>
<html lang="ar-JO" dir="rtl">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="وِصال، استوديو دعوات الزفاف الرقمية في الأردن. اختاروا تصميمًا وشاركوا دعوتكم برابط واحد.">
  <meta name="theme-color" content="#f9f7f1">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="وِصال">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>وِصال | دعوات الزفاف</title>
  <style>
    html, body { margin: 0; background-color: #f9f7f1; }
    #wisal-loading {
      position: fixed;
      inset: 0;
      display: grid;
      place-content: center;
      gap: .5rem;
      text-align: center;
      font: 1rem system-ui, sans-serif;
      color: #3f5347;
    }
    #wisal-loading strong { font-size: 1.5rem; color: #26382a; }
  </style>
</head>
<body>
  <div id="wisal-loading" role="status">
    <strong>وِصال</strong>
    <span>جارٍ التحميل…</span>
  </div>
  <script>
    const loading = document.getElementById('wisal-loading');
    if (window.location.pathname.startsWith('/i/') ||
        window.location.hash.startsWith('#/i/')) {
      loading.lastElementChild.textContent = 'جارٍ فتح الدعوة…';
    }
    window.addEventListener('flutter-first-frame', () => loading.remove(), { once: true });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
