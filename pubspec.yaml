name: wedding_project
description: "Arabic wedding invitations for the web."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.2
  firebase_core: ^5.1.0
  firebase_analytics: ^13.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/Amiri-OFL.txt
    - assets/fonts/NotoSansArabic-OFL.txt
  fonts:
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
    - family: Noto Sans Arabic
      fonts:
        - asset: assets/fonts/NotoSansArabic.ttf
